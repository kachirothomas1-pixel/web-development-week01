<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
        <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>My Budget Tracker</h1>
    <p>
      A Budget Tracker is a tool or program used to record, monitor, and manage
      the money you receive and the money you spend. It helps you understand
      where your money goes and how much money you have left.
    </p>
      <section>
        <h2>Add Expense</h2>

        <label for="expense-name">Expense Name:</label>
        <input
            type="text"
            id="expense-name"
            placeholder="Enter expense name"
        >

        <br><br>

        <label for="amount">Amount (KSh):</label>
        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
        >

        <br><br>

        <label for="category">Category:</label>
        <select id="category">
            <option value="">Select a category</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="education">Education</option>
            <option value="entertainment">Entertainment</option>
            <option value="other">Other</option>
        </select>

        <br><br>

        <button type="button">Add Expense</button>
        
<section>
    <h2>Your Expenses</h2>
    <p>No expenses yet</p>
</section>

  </body>
</html>
